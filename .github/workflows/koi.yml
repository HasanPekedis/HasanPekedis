name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yalongwastaken/git-koi@v1.0.2
        with:
          body: white
          output-dir: koi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Orange coat and room to swim
        run: |
          python -m pip install --quiet pillow
          python tools/koi_extras.py koi/koi.gif koi/koi.tmp.gif
          mv koi/koi.tmp.gif koi/koi.gif
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
